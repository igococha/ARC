name: build and test

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      # No sibling beast2 checkout on the runner, so build.xml downloads the
      # pinned BEAST source itself. Cache it so only the first run pays.
      - uses: actions/cache@v4
        with:
          path: beast-source
          key: beast-${{ hashFiles('build.xml') }}

      - name: Unit tests
        run: ant test

      - name: Build package
        run: ant build

      - uses: actions/upload-artifact@v4
        with:
          name: ARC-package
          path: dist/*.zip
